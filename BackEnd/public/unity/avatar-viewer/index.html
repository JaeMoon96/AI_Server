<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Avatar Viewer</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      body, html { margin:0; padding:0; height:100%; width:100%; background:#231F20; }
      #unity-container { width:100%; height:100vh; }
      #unity-canvas { width:100%; height:100%; display:block; }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Avatar Viewer</div>
      </div>
    </div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const apiBase = urlParams.get("apiBase") || "http://15.165.129.131:3000/api";
      const token   = urlParams.get("token")   || "";

      function getUserIdFromToken(tk) {
        if (!tk) return null;
        try { return JSON.parse(atob(tk.split(".")[1]))?.id || null; }
        catch { return null; }
      }
      const userId = getUserIdFromToken(token);

      let unityInstance = null;
      let isUnityReady = false;

      window.receiveUnityMessage = function (message) {
        if (message === "unityReady") {
          isUnityReady = true;
          if (token)  sendToUnity("SetToken", token);
          if (userId) sendToUnity("SetUserId", userId);
          let apiUrl = `${apiBase}/mannequin/showMannequin`;
          if (userId) apiUrl += `?userId=${encodeURIComponent(userId)}`;
          send("SetServerUrl", apiUrl);
          send("LoadMannequin", userId || "");
        }
      };

      function send(method, param = "") {
        if (!unityInstance || !isUnityReady) return false;
        try { unityInstance.SendMessage("WebGLManager", method, param); return true; }
        catch { return false; }
      }

      const canvas   = document.querySelector("#unity-canvas");
      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/Viewer.loader.js";
      const config = {
        dataUrl: buildUrl + "/Viewer.data",
        frameworkUrl: buildUrl + "/Viewer.framework.js",
        codeUrl: buildUrl + "/Viewer.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Avatar Viewer",
        productVersion: "0.1.0",
        showBanner: (msg, type) => console.log("Unity Banner:", type, msg),
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = (100 * progress) + "%";
        }).then((instance) => {
          unityInstance = instance;
          document.querySelector("#unity-loading-bar").style.display = "none";
        }).catch((message) => console.error(message));
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
