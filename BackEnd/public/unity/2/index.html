<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Cloth Viewer</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        #unity-container {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        body, html {
            margin: 0;
            padding: 0;
            background: #231F20;
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
    </div>

    <script>
        // 🔥 URL 파라미터에서 설정값 읽기
        const urlParams = new URLSearchParams(window.location.search);
        const apiBase = urlParams.get('apiBase') || 'http://15.165.129.131:3000/api';
        const token = urlParams.get('token') || '';
        const outfitId = urlParams.get('outfitId') || ''; // 🔥 특정 옷 ID

        console.log('🎯 Unity Cloth Viewer 초기화');
        console.log('API Base:', apiBase);
        console.log('Token:', token ? '✅ 있음' : '❌ 없음');
        console.log('Outfit ID:', outfitId || '❌ 없음 (전체 목록)');

        // 🔥 JWT 토큰에서 userId 추출
        function getUserIdFromToken(token) {
            if (!token) return null;
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                console.log('🔓 토큰 페이로드:', payload);
                return payload.id;
            } catch (error) {
                console.error('❌ 토큰 파싱 실패:', error);
                return null;
            }
        }

        const userId = getUserIdFromToken(token);
        console.log('👤 추출된 User ID:', userId);

        let unityInstance = null;
        let isUnityReady = false;

        // 🔥 Unity에서 오는 메시지 수신 함수 (필수!)
        window.receiveUnityMessage = function(message) {
            console.log('Unity Cloth 메시지:', message);
            
            if (message === 'unityReady') {
                isUnityReady = true;
                console.log('✅ Unity Cloth 준비 완료');
                
                // 🔥 서버 URL 설정
                if (apiBase && userId) {
                    let apiUrl = `${apiBase}/cloth/outfits?userId=${userId}`;
                    
                    // 특정 옷 ID가 있으면 추가
                    if (outfitId) {
                        apiUrl += `&outfitId=${outfitId}`;
                        console.log('👕 특정 옷 로드 모드:', outfitId);
                    }
                    
                    console.log('🔗 API URL 설정:', apiUrl);
                    sendToUnity('SetServerUrl', apiUrl);
                } else {
                    console.error('❌ API Base 또는 User ID가 없음');
                }
                
                // 🔥 의류 데이터 로드 시작
                setTimeout(() => {
                    if (outfitId) {
                        // 특정 옷 로드
                        console.log('👕 특정 옷 로드:', outfitId);
                        sendToUnity('LoadSpecificOutfit', outfitId);
                    } else {
                        // 전체 옷 목록 로드
                        console.log('👕 전체 옷 목록 로드');
                        sendToUnity('LoadAllOutfits', '');
                    }
                }, 1000);
                
            } else if (message.startsWith('outfitsLoaded:')) {
                const count = message.split(':')[1];
                console.log('✅ 의류 목록 로드 완료:', count + '개');
                
            } else if (message.startsWith('outfitChanged:')) {
                const changedOutfitId = message.split(':')[1];
                console.log('✅ 의류 변경 완료:', changedOutfitId);
                
                // 🔥 부모 창에 의류 변경 알림
                if (window.parent && window.parent.postMessage) {
                    window.parent.postMessage({
                        type: 'UNITY_CLOTH_CHANGED',
                        outfitId: changedOutfitId
                    }, '*');
                }
                
            } else if (message.startsWith('error:')) {
                const error = message.split(':')[1];
                console.error('❌ Unity Cloth 오류:', error);
                
            } else if (message.startsWith('clothDataLoaded:')) {
                const data = message.split(':')[1];
                console.log('✅ 옷 데이터 로드 완료:', data);
                
            } else if (message.startsWith('textureApplied:')) {
                const textureInfo = message.split(':')[1];
                console.log('✅ 텍스처 적용 완료:', textureInfo);
            }
        };

        // 🔥 Unity로 메시지 전송 헬퍼 함수
        function sendToUnity(methodName, parameter = '') {
            if (!unityInstance || !isUnityReady) {
                console.warn('⚠️ Unity가 아직 준비되지 않음');
                return false;
            }
            
            try {
                unityInstance.SendMessage('WebGLManager', methodName, parameter);
                console.log('📤 Unity Cloth 호출:', methodName, parameter);
                return true;
            } catch (error) {
                console.error('❌ Unity Cloth 호출 실패:', error);
                return false;
            }
        }

        // 🔥 Unity 배너 표시 함수
        function unityShowBanner(msg, type) {
            console.log('Unity Cloth Banner:', type, msg);
        }

        // 🔥 Unity 인스턴스 생성
        const canvas = document.querySelector("#unity-canvas");
        const buildUrl = "Build";
        const config = {
            dataUrl: buildUrl + "/WebClothingViewer.data",
            frameworkUrl: buildUrl + "/WebClothingViewer.framework.js",
            codeUrl: buildUrl + "/WebClothingViewer.wasm",
            streamingAssetsUrl: "StreamingAssets",
            showBanner: unityShowBanner,
        };

        // 🔥 모바일/데스크톱 감지 및 설정
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            const meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no';
            document.head.appendChild(meta);
            
            canvas.style.width = "100%";
            canvas.style.height = "100%";
        } else {
            canvas.style.width = "100%";
            canvas.style.height = "100%";
        }

        // 🔥 Unity 로더 스크립트 동적 로드
        document.querySelector("#unity-loading-bar").style.display = "block";

        const script = document.createElement("script");
        script.src = buildUrl + "/WebClothingViewer.loader.js";
        
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
            }).then((instance) => {
                unityInstance = instance;
                document.querySelector("#unity-loading-bar").style.display = "none";
                console.log('🎉 Unity Cloth 인스턴스 생성 완료');
            }).catch((error) => {
                console.error('❌ Unity Cloth 로드 실패:', error);
                alert('Unity Cloth 로드 실패: ' + error);
            });
        };

        script.onerror = () => {
            console.error('❌ Unity Cloth 로더 스크립트 로드 실패');
            alert('Unity Cloth 파일을 찾을 수 없습니다.');
        };

        document.body.appendChild(script);

        // 🔥 외부에서 호출 가능한 함수들
        window.loadOutfit = function(outfitId) {
            console.log('🎯 외부에서 옷 로드
