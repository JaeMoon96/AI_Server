<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | UMA_CLOSET</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">UMA_CLOSET</div>
      </div>
    </div>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      function unityShowBanner(msg, type) {
        const warningBanner = document.querySelector("#unity-warning");
        function update() { warningBanner.style.display = warningBanner.children.length ? 'block' : 'none'; }
        const div = document.createElement('div'); div.innerHTML = msg; warningBanner.appendChild(div);
        if (type === 'error') div.style = 'background:red;padding:10px;';
        else { if (type === 'warning') div.style = 'background:yellow;padding:10px;'; setTimeout(() => { warningBanner.removeChild(div); update(); }, 5000); }
        update();
      }

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/CLOSET.loader.js";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/CLOSET.data",
        frameworkUrl: buildUrl + "/CLOSET.framework.js",
        codeUrl: buildUrl + "/CLOSET.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "UMA_CLOSET",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      const urlParams = new URLSearchParams(window.location.search);
      const apiBase = urlParams.get("apiBase");
      const token   = urlParams.get("token");

      function decodeJwt(t) { try { return JSON.parse(atob(t.split(".")[1])); } catch { return {}; } }
      const decoded = decodeJwt(token || "");
  const userId = decoded?.id || "";

  let unityInstance = null;
  let isUnityReady = false;

  function sendToUnity(name, param = "") {
    if (!unityInstance || !isUnityReady) return;
    try {
      unityInstance.SendMessage("WebGLManager", name, param);
      console.log("📤 SendMessage:", name, param);
    } catch (e) {
      console.error("❌ SendMessage 실패:", e);
    }
  }

  // ✅ Unity → JS
  window.receiveUnityMessage = function (message) {
    console.log("📨 Unity → JS:", message);
    if (message === "unityReady") {
      isUnityReady = true;
      // 🔗 closet 빌드는 내부에서 /mannequin/showMannequin + /cloth/outfits 등을 호출하므로
      // apiBase 자체만 넘겨주면 됩니다. (빌드 로직에 맞추세요)
      if (apiBase) sendToUnity("SetServerUrl", apiBase);
      if (token)   sendToUnity("SetToken", token);
      if (userId)  sendToUnity("SetUserId", userId);
    }
  };

  // ...(모바일/데스크탑 분기 동일)

  document.querySelector("#unity-loading-bar").style.display = "block";
  const script = document.createElement("script");
  script.src = loaderUrl;
  script.onload = () => {
    createUnityInstance(canvas, config, (progress) => {
      document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
    }).then((instance) => {
      unityInstance = instance;
      document.querySelector("#unity-loading-bar").style.display = "none";
      document.querySelector("#unity-fullscreen-button").onclick = () => {
        unityInstance.SetFullscreen(1);
      };
      console.log("✅ closet-viewer Unity ready (JS side):", { apiBase, token: !!token, userId });
      // ❌ 여기서 SendMessage 호출하지 않습니다. (unityReady 이벤트를 기다림)
    }).catch((message) => {
      alert(message);
    });
  };
  document.body.appendChild(script);
</script>
  </body>
</html>
